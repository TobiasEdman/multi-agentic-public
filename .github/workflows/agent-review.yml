# .github/workflows/agent-review.yml
#
# Vendor-neutral agent PR review — matrix over (lens × model).
# Source spec: ~/Developer/agentic_workflow/docs/plans/tier2_multi_agent.md §C.
#
# MVP runs only the claude track. Adding codex / mistral is one matrix
# entry + one matching `if: matrix.model == '<x>'` step (placeholders below).
#
# Reviewer prompts live at .agents/prompts/{pragmatic,security,docs}-reviewer.md
# (vendor-neutral; per-runtime tool wiring lives here in the workflow).
#
# REQUIRED COMPANION FILES — this workflow fails on a missing-path error
# if .agents/prompts/{pragmatic,security,docs}-reviewer.md are not present
# in the repo. When porting this workflow to another repo, copy
# .agents/prompts/ along with it. See multi-agentic/CLAUDE.md
# § Files that must match other files for the formal pairing.
name: Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

env:
  REVIEW_EVENT: COMMENT  # change to REQUEST_CHANGES to block merge

jobs:
  classify:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@review'))
    runs-on: ubuntu-latest
    outputs:
      tier:    ${{ steps.classify.outputs.tier }}
      lenses:  ${{ steps.classify.outputs.lenses }}
      models:  ${{ steps.classify.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Risk-tier classifier (vendor-neutral)
        id: classify
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          HEAD="${{ github.event.pull_request.head.sha || 'HEAD' }}"
          .github/scripts/classify-pr.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          echo "::notice::classifier output written above"

  review:
    needs: classify
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    strategy:
      fail-fast: false
      matrix:
        lens:  ${{ fromJSON(needs.classify.outputs.lenses) }}
        model: ${{ fromJSON(needs.classify.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Mask credentials
        run: |
          for k in CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY MISTRAL_API_KEY; do
            v="${!k:-}"
            [ -n "$v" ] && echo "::add-mask::$v"
          done
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      # MVP: claude track. lens → prompt-file mapping:
      #   quality  → pragmatic-reviewer.md
      #   security → security-reviewer.md
      #   docs     → docs-reviewer.md
      #
      # Auth: OAuth token tied to your Claude Pro/Max subscription, not a
      # pay-per-token API key. Provision once with `/install-github-app`
      # from Claude Code (CLI or Desktop) — it sets CLAUDE_CODE_OAUTH_TOKEN
      # in repo secrets via the GitHub App flow.
      - name: Run review (model=claude, lens=${{ matrix.lens }})
        if: matrix.model == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          timeout_minutes: 30
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            LENS: ${{ matrix.lens }}
            RISK TIER: ${{ needs.classify.outputs.tier }}
            MODEL: claude

            Read .agents/prompts/${{ matrix.lens == 'quality' && 'pragmatic-reviewer' || matrix.lens == 'security' && 'security-reviewer' || 'docs-reviewer' }}.md.

            You are the "${{ matrix.lens }}" reviewer (claude track). Stay in lens.
            Use `gh pr comment` for one summary, prefixed "[claude/${{ matrix.lens }}]".
            Use `mcp__github_inline_comment__create_inline_comment` for line-level findings.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # PLACEHOLDER for v2 — Codex track:
      # - name: Run review (model=codex, lens=${{ matrix.lens }})
      #   if: matrix.model == 'codex'
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     pip install codex-cli  # or whatever ships
      #     codex review \
      #       --pr ${{ github.event.pull_request.number }} \
      #       --lens ${{ matrix.lens }} \
      #       --prompt-file .agents/prompts/${{ matrix.lens == 'quality' && 'pragmatic-reviewer' || matrix.lens == 'security' && 'security-reviewer' || 'docs-reviewer' }}.md \
      #       --comment-prefix "[codex/${{ matrix.lens }}]"

      # PLACEHOLDER for v3 — Mistral track (likely via OpenCode):
      # - name: Run review (model=mistral, lens=${{ matrix.lens }})
      #   if: matrix.model == 'mistral'
      #   env:
      #     MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      #   run: |
      #     # OpenCode + Mistral backend, or direct Mistral Agents API
      #     ...
