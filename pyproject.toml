[project]
name = "multi-agentic"
version = "0.1.0"
description = "Vendor-neutral toolkit for multi-agent collaborative coding (writer/reviewer pattern, branch-per-agent, file-locks)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "agentic-workflow contributors"},
]

# Add runtime dependencies here. Pin upper bounds for libraries that make
# breaking minor bumps (e.g. llama-index, pydantic). See agentic_workflow
# rollout W1.3 for the rationale.
dependencies = [
    "typer>=0.12,<1",
    "jsonschema>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# Opt-in observability — wire OpenTelemetry only when OTEL_EXPORTER_OTLP_ENDPOINT
# is set. See agentic_workflow rollout W2.2 for the fail-open pattern.
observability = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2",
]

[project.scripts]
agentic-task = "agentic_task.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_task*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
